appId: com.videoforyou.recorder
productName: VideoForYou
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: VideoForYou
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
